services:
  postgres:
    image: postgres:16-alpine
    container_name: bothub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bothub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bothub_pg_local_2026}
      POSTGRES_DB: ${POSTGRES_DB:-bothub}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bothub} -d ${POSTGRES_DB:-bothub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bothub-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: bothub-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      SESSIONS_DIR: /app/apps/api/sessions
      DATABASE_URL: ${DATABASE_URL:-postgresql://bothub:bothub_pg_local_2026@postgres:5432/bothub?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
      ENCRYPTION_KEY_HEX: ${ENCRYPTION_KEY_HEX:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-}
      INITIAL_ORG_NAME: ${INITIAL_ORG_NAME:-}
    volumes:
      - api_sessions:/app/apps/api/sessions
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: bothub-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  postgres_data:
  redis_data:
  api_sessions:
