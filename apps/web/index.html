<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var storedScheme = localStorage.getItem('color-scheme');
        var metaScheme = document.querySelector('meta[name="color-scheme"]');
        if (metaScheme) {
          metaScheme.content = storedScheme ?? 'light dark';
        }
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var resolvedTheme = storedScheme === 'dark' || (!storedScheme && prefersDark) ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', resolvedTheme);
      } catch (e) {}
    </script>
    <title>BotHub · Plataforma de Bots de WhatsApp & Chatwoot</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Open+Sans:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
